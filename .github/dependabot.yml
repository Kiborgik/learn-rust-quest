# Keeps the CI actions up to date. Crates are left alone: the game has
# none, and quest crates use version ranges on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Its refs are toolchains (`stable`, `1.88`), not versions. The msrv
      # job pins 1.88 on purpose; bumping it would skip the check.
      - dependency-name: dtolnay/rust-toolchain
